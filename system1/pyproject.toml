[project]
name = "openpi"
version = "0.1.0"
description = "System1 (pi0.5 RoboCasa) inference server -- inference-only subset of openpi"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
# Pins copied from openpi's pyproject (commit e5bad79a); only what the inference files import.
dependencies = [
    "augmax>=0.3.4",
    "beartype==0.19.0",
    "chex==0.1.90",
    "einops>=0.8.0",
    "filelock>=3.16.1",
    "flax==0.10.2",
    "fsspec[gcs]>=2024.6.0",
    "jax[cuda12]==0.5.3",
    "jaxtyping==0.2.36",
    "numpy>=1.22.4,<2.0.0",
    "numpydantic>=1.6.6",
    "openpi-client",
    "orbax-checkpoint==0.11.13",
    "pillow>=11.0.0",
    "sentencepiece>=0.2.0",
    # model.py / policy.py / image_tools.py import torch + the (unused) PyTorch pi0 at module level.
    "torch==2.7.1",
    "tqdm-loggable>=0.2",
    "transformers==4.53.2",
    "typing-extensions>=4.12.2",
    "tyro>=0.9.5",
]

[tool.uv]
override-dependencies = ["ml-dtypes==0.4.1", "tensorstore==0.1.74"]

[tool.uv.sources]
openpi-client = { workspace = true }

[tool.uv.workspace]
members = ["packages/*"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/openpi"]
